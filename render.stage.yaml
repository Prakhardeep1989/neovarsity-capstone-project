# STAGE deployment — Render free tier (Test Mode Razorpay, separate Atlas DB)
# New → Blueprint → connect repo → select this file, or rename to render.yaml for first deploy.
services:
  - type: web
    name: homely-meals-api-stage
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: MONGODB_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOW_VERCEL_PREVIEWS
        value: "true"
      - key: RATE_LIMIT_MAX
        value: "200"
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: RESEND_SANDBOX_EMAIL
        sync: false
